apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: libvirt-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.122.200-192.168.122.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: libvirt-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - libvirt-pool
