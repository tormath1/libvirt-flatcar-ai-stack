apiVersion: airunway.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: gemma2-2b-z1fj
  namespace: kaito-workspace
  labels:
    app.kubernetes.io/name: airunway
    app.kubernetes.io/instance: gemma2-2b-z1fj
    app.kubernetes.io/managed-by: airunway
spec:
  model:
    id: gemma2:2b
    source: huggingface
  gateway:
    enabled: true
  engine:
    type: llamacpp
    trustRemoteCode: false
    enablePrefixCaching: true
    enforceEager: true
  serving:
    mode: aggregated
  image: ghcr.io/kaito-project/aikit/gemma2:2b
  provider:
    name: kaito
  scaling:
    replicas: 1
  resources:
    gpu:
      count: 0
      type: nvidia.com/gpu

