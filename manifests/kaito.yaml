# Source: workspace/charts/local-csi-driver/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-local-node
  namespace: 'kaito-workspace'
  labels:
    app: csi-local
    app.kubernetes.io/component: csi-local-node
    helm.sh/chart: local-csi-driver-0.4.1
    app.kubernetes.io/name: local-csi-driver
    app.kubernetes.io/instance: kaito-workspace
    app.kubernetes.io/version: "v0.4.1"
    app.kubernetes.io/managed-by: Helm
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
  selector:
    matchLabels:
      app: csi-local-node
  template:
    metadata:
      labels:
        app: csi-local-node
      annotations:
        kubectl.kubernetes.io/default-container: driver
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            # Default mandatory constraints when no custom nodeAffinity provided
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64

      containers:
      - name: driver
        args:
        - --node-name=$(NODE_NAME)
        - --pod-name=$(POD_NAME)
        - --pod-uid=$(POD_UID)
        - --namespace=$(POD_NAMESPACE)
        - --csi-bind-address=unix:///csi/csi.sock
        - --worker-threads=100
        - --kube-api-qps=100
        - --kube-api-burst=200
        - --metrics-bind-address=:8080
        - --metrics-secure=false
        - --health-probe-bind-address=:8081
        - --trace-address=
        - --trace-sample-rate=1000000
        - --trace-service-id=$(POD_NAME)
        - --v=2
        - --enable-cleanup=true
        - --enable-lv-garbage-collection=true
        - --enable-lvm-orphan-cleanup=true
        - --lvm-orphan-cleanup-interval=5m
        - --volume-wipe-enabled=true
        - --volume-wipe-interval=60s
        - --volume-wipe-concurrency=1
        - --run-alongside-webhook=true

        - --disk-path-prefixes=
        - --disk-models=
        - --disk-types=
        command:
        - /local-csi-driver
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: "mcr.microsoft.com/acstor/local-csi-driver:v0.4.1"
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 600Mi
          requests:
            cpu: 10m
            memory: 60Mi
        securityContext:
          privileged: true
          capabilities:
            drop:
              - ALL
        terminationMessagePath: /tmp/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /dev
          name: device
        - mountPath: /csi
          name: csi-socket-dir
        - mountPath: /var/lib/kubelet/
          mountPropagation: Bidirectional
          name: mountpoint-dir

      - name: csi-provisioner
        args:
        - --csi-address=/csi/csi.sock
        - --node-deployment
        - --http-endpoint=:8090
        - --retry-interval-start=1s
        - --retry-interval-max=30s
        - --worker-threads=100
        - --kube-api-qps=100
        - --kube-api-burst=200
        - --extra-create-metadata
        - --feature-gates=Topology=true,VolumeAttributesClass=false
        - --strict-topology=true
        - --enable-capacity
        - --capacity-ownerref-level=0
        - --capacity-poll-interval=15s
        - --v=2
        env:
        # POD_NAME and POD_NAMESPACE are used for capacity tracking support
        # More info: https://github.com/kubernetes-csi/external-provisioner?tab=readme-ov-file#capacity-support
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: "mcr.microsoft.com/oss/v2/kubernetes-csi/csi-provisioner:v6.1.1"
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 20
          tcpSocket:
            port: provisioner
          timeoutSeconds: 10
        ports:
        - containerPort: 8090
          name: provisioner
          protocol: TCP
        resources:
          limits:
            memory: 500Mi
          requests:
            cpu: 10m
            memory: 20Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - mountPath: /csi
          name: csi-socket-dir

      - name: csi-resizer
